[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:api]
command=dotnet /app/api/EnfoqueAutomotriz.Api.dll
environment=ASPNETCORE_URLS="%(ENV_ASPNETCORE_URLS_API)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=5

[program:ui]
command=dotnet /app/ui/EnfoqueAutomotriz.UI.dll
environment=ASPNETCORE_URLS="%(ENV_ASPNETCORE_URLS_UI)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=5
startsecs=5
